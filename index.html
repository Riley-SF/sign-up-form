<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="images/goose.svg" alt="Goose logo">
        <div>Silly Goose</div>
    </header>
    <main>
        <p>
            This is not a real online service! 
            You know you need the Silly Goose in your life to help you realize you deepest dreams.
            <br>
            Sign up <em>now</em> to get started.
        </p>
        <p>You know you want to.</p>
        <form id="sign-up-form" action="example.com/path" method="post">
            <h1>Let's do this!</h1>
            <fieldset>
                <div>
                    <label for="first-name">FIRST NAME</label>
                    <input type="text" id="first-name" name="first-name" required>
                </div>
                <div>
                    <label for="last-name">LAST NAME</label>
                    <input type="text" id="last-name" name="last-name" required>
                </div>
            </fieldset>
            <fieldset>
                <div>
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="phone-number">PHONE NUMBER</label>
                    <input type="tel" id="phone-number" name="phone-number" required>
                </div>
            </fieldset>
            <fieldset>
                <div>
                    <label for="password">PASSWORD</label>
                    <input type="text" id="password" name="password" required minlength="8" maxlength="12">
                </div>
                <div>
                    <label for="confirm-password">CONFIRM PASSWORD</label>
                    <input type="text" id="confirm-password" name="confirm-password" required minlength="8" maxlength="12">
                </div>
            </fieldset>
        </form>
        <button type="submit" form="sign-up-form">Create Account</button>
    </main>
</body>
</html>
